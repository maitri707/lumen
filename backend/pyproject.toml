requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=12.0",
    "boto3>=1.35.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.9.0",
    "pillow>=10.4.0",
    "aiofiles>=24.1.0",
    "google-adk>=2.2.0",
